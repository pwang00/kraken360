[package]
name = "kraken360"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Linux temperature dashboard and USB LCD transport for NZXT Kraken Elite V2"
license = "MIT"
readme = "RUST.md"
include = ["/src/**", "/tests/**", "/Cargo.toml", "/Cargo.lock", "/RUST.md", "/LICENSE"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fontdue = "0.9"
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
rusb = { version = "0.9", features = ["vendored"] }
signal-hook = "0.3"
wait-timeout = "0.2"
